services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-api
    working_dir: /var/www
    volumes:
      - .:/var/www
      # vendor fica em volume proprio, fora do bind mount do Windows.
      - vendor:/var/www/vendor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: questoes_adaptativas
      DB_USERNAME: qa_user
      DB_PASSWORD: qa_pass
      # O servidor embutido do PHP atende uma requisicao por vez. Sem workers, as
      # chamadas da interface enfileiram e a tela parece travada.
      PHP_CLI_SERVER_WORKERS: 10
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8.0
    container_name: qa-db
    environment:
      MYSQL_DATABASE: questoes_adaptativas
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  vendor:
